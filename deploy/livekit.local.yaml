port: 7880
bind_addresses: [0.0.0.0]
rtc:
  tcp_port: 7881
  udp_port: 7882
  # Let LiveKit advertise the interface where its UDP socket actually listens.
  # Forcing loopback here can advertise 127.0.0.1 while UDP binds the LAN IP.
  use_external_ip: false
keys:
  devkey: devsecret
logging:
  level: info
