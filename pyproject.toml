[project]
name = "portrait-voice-agent"
version = "0.1.0"
description = "LiveKit + Soniox voice agent with an audio-driven speaking portrait"
requires-python = ">=3.12,<3.13"
dependencies = [
  "livekit-agents[soniox,openai,silero]==1.8.8",
  "livekit-plugins-google==1.8.8",
  "livekit-api>=1.1,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1,<2",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
